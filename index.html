<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お昼ご飯フローチャート | 森之宮キャンパス</title>
<style>
  :root{
    --bg:#FAFAF8;
    --ink:#111827;
    --sub:#6B7280;
    --border:#E5E7EB;
    --yes:#059669;
    --no:#6B7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .app{
    width:100%;
    max-width:480px;
  }
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    font-size:20px;
    margin:0 0 4px;
    font-weight:700;
  }
  header p{
    margin:0;
    font-size:13px;
    color:var(--sub);
  }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:18px;
  }
  .progress-bar{
    flex:1;
    height:6px;
    background:#E5E7EB;
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,#6366F1,#2563EB);
    border-radius:3px;
    transition:width .35s ease;
  }
  .progress-label{
    font-size:12px;
    color:var(--sub);
    white-space:nowrap;
  }

  .card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:18px;
    padding:28px 22px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    min-height:340px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    animation:fadeIn .3s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  .q-tag{
    font-size:12px;
    font-weight:700;
    color:#4F46E5;
    background:#EEF2FF;
    display:inline-block;
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
    align-self:flex-start;
  }
  .q-text{
    font-size:22px;
    font-weight:700;
    line-height:1.5;
    margin:0 0 28px;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .choice-btn{
    border:none;
    border-radius:14px;
    padding:18px 20px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    transition:transform .12s ease, filter .12s ease;
  }
  .choice-btn:active{
    transform:scale(.97);
    filter:brightness(.92);
  }
  .choice-btn.yes{ background:var(--yes); }
  .choice-btn.no{ background:var(--no); }
  .choice-btn .arrow{ opacity:.8; font-size:18px; }

  /* free result (special) */
  .free-result{
    text-align:center;
  }
  .free-result .big-icon{
    font-size:44px;
    margin-bottom:10px;
  }
  .free-result h2{
    font-size:19px;
    margin:0 0 8px;
  }
  .free-result p{
    font-size:14px;
    color:var(--sub);
    line-height:1.7;
    margin:0;
  }

  /* store result */
  .result{
    text-align:left;
  }
  .result-header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  .badge{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:17px;
    flex-shrink:0;
  }
  .result-name{
    font-size:20px;
    font-weight:700;
  }
  .star-tag{
    display:inline-block;
    margin-top:4px;
    font-size:11.5px;
    font-weight:700;
    background:#FEF3C7;
    color:#92400E;
    border:1px solid #F59E0B;
    padding:2px 9px;
    border-radius:999px;
  }
  .result-sub{
    font-size:13px;
    color:var(--sub);
    margin:14px 0 4px;
  }
  .result-block{
    margin-bottom:14px;
  }
  .result-block .label{
    font-size:12.5px;
    font-weight:700;
    margin-bottom:6px;
  }
  .result-block.pros .label{ color:#059669; }
  .result-block.cons .label{ color:#DC2626; }
  .result-block ul{
    margin:0;
    padding-left:18px;
    font-size:14.5px;
    line-height:1.8;
  }

  .nav-row{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  .btn-ghost, .btn-restart{
    flex:1;
    padding:14px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    border:none;
    text-align:center;
  }
  .btn-ghost{
    background:#F3F4F6;
    color:#374151;
  }
  .btn-ghost:active{ filter:brightness(.95); }
  .btn-restart{
    background:#111827;
    color:#fff;
  }
  .btn-restart:active{ filter:brightness(1.2); }

  .back-row{
    margin-top:14px;
    text-align:center;
  }
  .back-link{
    background:none;
    border:none;
    color:var(--sub);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    padding:6px;
  }

  footer{
    text-align:center;
    margin-top:22px;
    font-size:11px;
    color:#9CA3AF;
    line-height:1.6;
  }

  .spot-section{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--border); }
  .spot-section .label{ font-size:12.5px; font-weight:700; color:#4B5563; margin-bottom:10px; }
  .spot-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .spot-item{ border-radius:10px; overflow:hidden; border:1px solid var(--border); background:#fff; }
  .spot-item img{ width:100%; height:66px; object-fit:cover; display:block; }
  .spot-item .spot-name{ font-size:10px; text-align:center; padding:4px 3px; color:#374151; font-weight:600; background:#F9FAFB; line-height:1.3; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>お昼ご飯フローチャート</h1>
    <p>大阪公立大学 森之宮キャンパス</p>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">質問 1</div>
  </div>

  <div class="card" id="card"></div>

  <div class="back-row" id="backRow" style="display:none;">
    <button class="back-link" id="backBtn">← ひとつ前の質問に戻る</button>
  </div>

  <footer>タップして進む、あなたに合ったお昼ご飯の場所を見つけよう。</footer>
</div>

};

const STORE_SPOTS = {
  1:["A","B","C","H"],
  2:["B","C","D","F","H","I"],
  3:["D","F","G","I"],
  4:["B","D","E","F","I"],
  5:["C","F","H","I"],
  6:["D","F","H","I"],
  7:["C","F","H","I"],
};
const ALL_SPOTS = ["A","B","C","D","E","F","G","H","I"];


function leaf(n){ return {leaf:"store", store:n}; }

const TREE = {
  q:"2, 3限に空きコマがある？",
  yes:{ leaf:"free" },
  no:{
    q:"ミールパス、絶対に使いたい？",
    yes:{
      q:"たくさん食べたい？",
      yes:leaf(1),
      no:leaf(4)
    },
    no:{
      q:"急いでいる？",
      yes:{
        q:"値段が高くてもいい？",
        yes:leaf(5),
        no:leaf(3)
      },
      no:{
        q:"5人以上のグループ？",
        yes:{
          q:"温かいものが食べたい？",
          yes:leaf(6),
          no:leaf(7)
        },
        no:leaf(2)
      }
    }
  }
};

const TOTAL_STEPS = 6; // longest path depth, for progress estimate
let path = [];       // stack of nodes visited (for back button)
let current = TREE;

const card = document.getElementById("card");
const progressFill = document.getElementById("progressFill");
const progressLabel = document.getElementById("progressLabel");
const backRow = document.getElementById("backRow");
const backBtn = document.getElementById("backBtn");

function render(){
  card.innerHTML = "";
  const depth = path.length;
  progressLabel.textContent = current.leaf ? "結果" : "質問 " + (depth+1);
  const pct = current.leaf ? 100 : Math.min(95, (depth/TOTAL_STEPS)*100);
  progressFill.style.width = pct + "%";
  backRow.style.display = depth>0 ? "block" : "none";

  if(current.leaf === "free"){
    card.innerHTML = `
      <div class="free-result">
        <div class="big-icon">🎉</div>
        <h2>どこで買ってもOK！</h2>
        <p>2, 3限は大体空いているので、<br>好きな場所で買いましょう。</p>
      </div>
      <div class="spot-section"><div class="label">🍽 使えるスペース例</div><div class="spot-grid">${ALL_SPOTS.map(l=>{const sp=EATING_SPOTS[l];return `<div class="spot-item"><img src="${sp.img}" alt="${sp.name}"><div class="spot-name">${l}：${sp.name}</div></div>`;}).join("")}</div></div>
      <div class="nav-row">
        <button class="btn-ghost" id="ghostBtn">戻る</button>
        <button class="btn-restart" id="restartBtn">最初から</button>
      </div>
    `;
  } else if(current.leaf === "store"){
    const s = STORES[current.store];
    card.innerHTML = `
      <div class="result">
        <div class="result-header">
          <div class="badge" style="background:${s.color}">${current.store}</div>
          <div>
            <div class="result-name">${s.name}</div>
            ${s.star ? '<span class="star-tag">★ ミールパス対象</span>' : ''}
          </div>
        </div>
        <div class="result-sub">あなたにおすすめの場所はここ！</div>
        <div class="result-block pros">
          <div class="label">良い点</div>
          <ul>${s.pros.map(p=>`<li>${p}</li>`).join("")}</ul>
        </div>
        <div class="result-block cons">
          <div class="label">注意点</div>
          <ul>${s.cons.map(c=>`<li>${c}</li>`).join("")}</ul>
        </div>
        <div class="spot-section"><div class="label">🍽 おすすめの食べる場所</div><div class="spot-grid">${STORE_SPOTS[current.store].map(l=>{const sp=EATING_SPOTS[l];return `<div class="spot-item"><img src="${sp.img}" alt="${sp.name}"><div class="spot-name">${l}：${sp.name}</div></div>`;}).join("")}</div></div>
      </div>
      <div class="nav-row">
        <button class="btn-ghost" id="ghostBtn">戻る</button>
        <button class="btn-restart" id="restartBtn">最初から</button>
      </div>
    `;
  } else {
    card.innerHTML = `
      <div class="q-tag">Q${depth+1}</div>
      <p class="q-text">${current.q}</p>
      <div class="choices">
        <button class="choice-btn yes" id="yesBtn">YES <span class="arrow">›</span></button>
        <button class="choice-btn no" id="noBtn">NO <span class="arrow">›</span></button>
      </div>
    `;
  }

  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const ghostBtn = document.getElementById("ghostBtn");
  const restartBtn = document.getElementById("restartBtn");
  if(yesBtn) yesBtn.onclick = ()=> go("yes");
  if(noBtn) noBtn.onclick = ()=> go("no");
  if(ghostBtn) ghostBtn.onclick = goBack;
  if(restartBtn) restartBtn.onclick = restart;
}

function go(choice){
  path.push(current);
  current = current[choice];
  render();
}

function goBack(){
  if(path.length===0) return;
  current = path.pop();
  render();
}
backBtn.onclick = goBack;

function restart(){
  path = [];
  current = TREE;
  render();
}

render();
</script>
</body>
